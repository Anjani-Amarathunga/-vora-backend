spring:
  datasource:
    url: jdbc:h2:mem:voradb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  jwt:
    secret: c3VwZXItc2VjcmV0LWtleS1mb3Itdm9yYS1iYWNrZW5kLWRldi1tb2Rl
    expiration-ms: 86400000
