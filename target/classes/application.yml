spring:
  profiles:
    active: dev
  config:
    import: optional:application-local.yml
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:voradb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: c3VwZXItc2VjcmV0LWtleS1mb3Itdm9yYS1iYWNrZW5kLWRldi1tb2Rl
    expiration-ms: 86400000

logging:
  level:
    root: INFO
    com.vora.backend: DEBUG

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/evora_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:evora_user}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: c3VwZXItc2VjcmV0LWtleS1mb3Itdm9yYS1iYWNrZW5kLWRldi1tb2Rl
    expiration-ms: 86400000

logging:
  level:
    root: INFO
    com.vora.backend: DEBUG
